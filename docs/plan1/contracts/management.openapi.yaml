  parameters:
    SameOriginHeader:
      in: header
      name: Origin
      required: true
      schema: {type: string, minLength: 1}
    Limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100}
      required: false
    Cursor:
      in: query
      name: cursor
      schema: {type: string}
      required: false
    ConfigId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    ExpectedVersion:
      in: query
      name: expected_version
      schema: {type: integer, minimum: 1}
      required: true
    From:
      in: query
      name: from
      schema: {type: string, format: date-time}
      required: false
    To:
      in: query
      name: to
      schema: {type: string, format: date-time}
      required: false
    ProjectId:
      in: query
      name: project_id
      schema: {type: string, format: uuid}
      required: false
    Operation:
      in: query
      name: operation
      schema: {type: string}
      required: false
    Status:
      in: query
      name: status
      schema:
        type: string
        enum: [running, success, partial, empty, error, cancelled]
      required: false
    Q:
      in: query
      name: q
      schema: {type: string}
      required: false
    RecordId:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 1}
    CallOrigin:
      in: query
      name: origin
      schema:
        type: string
        enum: [business, debug, endpoint_test, proxy_test, cache_background]
      required: false
    Capability: {in: query, name: kind, schema: {enum: [search, reader, model]}}
    BusinessLanguage: {in: query, name: language, schema: {type: string, minLength: 1}}
    CallStatus: {in: query, name: status, schema: {enum: [success, partial, empty, error, cancelled]}}
    Evaluation: {in: query, name: evaluation, schema: {enum: [complete, incomplete, unscored, no_candidates, received, missing, model]}}
    EndpointId:
      in: query
      name: endpoint_id
      schema: {type: string, format: uuid}
      required: false
