      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyUpdate'}
      responses:
        '200':
          description: 更新VPN 代理
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/ProxyView'}
        default: {$ref: '#/components/responses/Failure'}
    delete:
      operationId: deleteProxy
      summary: 检查引用并归档VPN 代理
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      - {$ref: '#/components/parameters/ExpectedVersion'}
      - {$ref: '#/components/parameters/SameOriginHeader'}
      responses:
        '200':
          description: 检查引用并归档VPN 代理
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Deleted'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/proxies/{id}/test:
    post:
      operationId: testProxy
      summary: 测试已保存的VPN 代理
      security:
      - AdminSession: []
        Csrf: []
