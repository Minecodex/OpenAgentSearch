openapi: 3.1.0
info: {title: OpenAgentSearch 管理与健康 API, version: 1.0.0-draft}
paths:
  /admin/v1/session:
    post:
      operationId: login
      summary: 登录
      security: []
      parameters:
      - {$ref: '#/components/parameters/SameOriginHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses:
        '200':
          description: 登录
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Session'}
          headers:
            Set-Cookie:
              schema: {type: string}
              description: 设置或清除 HttpOnly 管理会话。
        default: {$ref: '#/components/responses/Failure'}
    get:
      operationId: getSession
      summary: 恢复会话
      security:
      - AdminSession: []
      responses:
        '200':
          description: 恢复会话
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Failure'}
    delete:
      operationId: logout
      summary: 注销
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/SameOriginHeader'}
      responses:
        '200':
          description: 注销
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {type: 'null'}
          headers:
            Set-Cookie:
              schema: {type: string}
              description: 设置或清除 HttpOnly 管理会话。
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/settings/retention:
    get:
      operationId: getHistoryRetention
      summary: 查看全局历史保留设置
      security: [{AdminSession: []}]
      responses:
        '200': {$ref: '#/components/responses/HistoryRetention'}
        default: {$ref: '#/components/responses/Failure'}
    put:
      operationId: updateHistoryRetention
      summary: 统一修改所有项目新记录的历史保留天数
      security: [{AdminSession: [], Csrf: []}]
      parameters: [{$ref: '#/components/parameters/SameOriginHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionWrite'}
      responses:
        '200': {$ref: '#/components/responses/HistoryRetention'}
        '409': {$ref: '#/components/responses/Failure', description: expected_version 与当前设置版本不匹配。}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/projects:
    get:
      operationId: listProject
      summary: 分页查询项目
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 分页查询项目
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {$ref: '#/components/schemas/ProjectView'}
                          minItems: 0
                        next_cursor:
                          anyOf:
                          - {type: string, minLength: 1}
                          - {type: 'null'}
                      required: [items, next_cursor]
                      additionalProperties: false
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: createProject
      summary: 创建项目
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/SameOriginHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: 创建项目
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/ProjectCreated'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/projects/{id}:
    get:
      operationId: getProject
      summary: 读取项目
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      responses:
        '200':
          description: 读取项目
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/ProjectView'}
        default: {$ref: '#/components/responses/Failure'}
    put:
      operationId: updateProject
      summary: 更新项目
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      - {$ref: '#/components/parameters/SameOriginHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectUpdate'}
      responses:
        '200':
          description: 更新项目
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/ProjectView'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoints:
    get:
      operationId: listEndpoint
      summary: 分页查询接入点
      description: 包含两个稳定的 Firefox 系统能力及其就绪 Pod 数，项目引用能力 ID。
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 分页查询接入点
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {$ref: '#/components/schemas/EndpointView'}
                          minItems: 0
                        next_cursor:
                          anyOf:
                          - {type: string, minLength: 1}
                          - {type: 'null'}
                      required: [items, next_cursor]
                      additionalProperties: false
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: createEndpoint
      summary: 创建接入点
      description: 创建手工配置的原生服务或模型接入点。内置浏览器能力由系统提供。
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/SameOriginHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointCreate'}
      responses:
        '201':
          description: 创建接入点
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/EndpointView'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoints/{id}:
    get:
      operationId: getEndpoint
      summary: 读取接入点
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      responses:
        '200':
          description: 读取接入点
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/EndpointView'}
        default: {$ref: '#/components/responses/Failure'}
    put:
      operationId: updateEndpoint
      summary: 更新接入点
      description: 变更手工配置的接入点。内置 Firefox 执行成员由部署副本自动同步。
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      - {$ref: '#/components/parameters/SameOriginHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointUpdate'}
      responses:
        '200':
          description: 更新接入点
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/EndpointView'}
        default: {$ref: '#/components/responses/Failure'}
    delete:
      operationId: deleteEndpoint
      summary: 检查引用并归档接入点
      description: 系统内置能力受保护；对其执行写入或归档返回 409。
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
      - {$ref: '#/components/parameters/ExpectedVersion'}
      - {$ref: '#/components/parameters/SameOriginHeader'}
      responses:
        '200':
          description: 检查引用并归档接入点
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Deleted'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoints/{id}/test:
    post:
      operationId: testEndpoint
      summary: 测试已保存的接入点
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
