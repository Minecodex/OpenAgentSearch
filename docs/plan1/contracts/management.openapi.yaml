                - type: integer
                  minimum: 0
                  maximum: 100
                - type: 'null'
            required:
            - source_id
            - url
            - title
            - ranks
            - variant_ids
            - score
            additionalProperties: false
          minItems: 0
        segments:
          type: array
          items:
            type: object
            properties:
              source_id:
                type: string
                minLength: 1
              segment_id:
                type: string
                minLength: 1
              start_char:
                type: integer
                minimum: 0
              end_char:
                type: integer
                minimum: 0
              summary:
                type: string
              cited:
                type: boolean
              text_preview:
                type:
                - string
                - 'null'
            required:
            - source_id
            - segment_id
            - start_char
            - end_char
            - summary
            - cited
            additionalProperties: false
          minItems: 0
        cache_lookups:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - lookup_id
            - questions
            - snapshot_ids
            - degraded
            - bypass
            - hit
            - search_needed
            properties:
              degraded:
                type: boolean
              bypass:
                type: boolean
              hit:
                type: boolean
              search_needed:
                type: boolean
              verification:
                type: object
                additionalProperties: false
                required: [profile, state, elapsed_ms, reason, threshold, decisions]
                properties:
                  profile: {type: string}
                  state: {enum: [no_candidates, verified, uncalibrated, material_changed, fallback]}
                  shortlisted_question_ids: {type: array, maxItems: 8, items: {type: string}}
                  question_texts:
                    type: object
                    maxProperties: 8
                    additionalProperties: {type: string}
                    description: 按送审问题标识保存当次历史问句。
                  elapsed_ms: {type: [integer, 'null'], minimum: 0}
                  reason: {type: [string, 'null']}
                  threshold: {type: [number, 'null'], minimum: 0, maximum: 1}
                  decisions:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      additionalProperties: false
                      required: [question_id, label, reusable_score]
                      properties:
                        question_id: {type: string}
                        label: {enum: [reusable, insufficient, conflict]}
                        reusable_score: {type: number, minimum: 0, maximum: 1}
              lookup_id:
                type: string
              span_id: {type: string, description: 本次读取所属执行阶段}
              query: {type: string, description: 本次实际检索的问句}
              matched_snapshots:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [snapshot_id, question_id, query, exact, source, collected_at]
                  properties:
                    snapshot_id: {type: string}
                    question_id: {type: string}
                    query: {type: string, description: 采集这份快照时使用的历史问句}
                    exact: {type: boolean}
                    source: {type: string, description: 采集来源接入点标识}
                    collected_at: {type: integer, description: 快照采集时间戳（毫秒）}
              questions:
                type: array
                items:
                  type: string
              snapshot_ids:
                type: array
                items:
                  type: string
      required:
      - variants
      - candidates
      - sources
      - segments
      additionalProperties: false

