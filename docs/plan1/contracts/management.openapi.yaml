        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/requests/{id}/cancel:
    post:
      operationId: cancelRequest
      summary: 取消可见的在途请求
      security: [{AdminSession: [], Csrf: []}]
      parameters: [{$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/SameOriginHeader'}]
      responses:
        '200':
          description: 已通知在途执行取消，cancelled 为 false 表示请求已结束。
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties: {data: {type: object, required: [cancelled], properties: {cancelled: {type: boolean}}, additionalProperties: false}}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/requests/{id}/evidence:
    get:
      operationId: getEvidence
      summary: 请求来源与分段
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200':
          description: 请求来源与分段
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Evidence'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/requests/{id}/spans/{span_id}:
    get:
      operationId: getSpanDetail
      summary: 请求单步载荷
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/RecordId'}
      - in: path
        name: span_id
        required: true
        schema: {type: string, minLength: 1}
      responses:
        '200':
          description: 请求单步载荷
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/SpanDetail'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/requests/{id}/replay/{material_id}/layout:
    get:
      operationId: getReplayLayout
      summary: 读取单份归档网页的静态布局
      description: 校验管理会话、请求归属、材料归属及保留期。父页按需取得 JSON，以隔离 iframe 显示其中的 srcdoc。
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/RecordId'}
      - {in: path, name: material_id, required: true, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: 归档的静态布局，包含可用的样式和资源。
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties: {data: {$ref: ./replay-layout.schema.yaml}}
        '404': {$ref: '#/components/responses/Failure', description: 请求或材料不可见，或该材料没有可读布局。}
        '410': {$ref: '#/components/responses/Failure', description: 已核验归属并确认请求及布局均已达到创建时固定的到期时刻。}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/requests/{id}/export:
    get:
      operationId: getExport
      summary: 请求脱敏导出
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200':
          description: 请求脱敏导出
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Export'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoint-calls:
    get:
      operationId: listCalls
      summary: 查询上游尝试
      security:
      - AdminSession: []
      description: Firefox 搜索切换引擎时分别记录 Google 和百度调用，百度调用在 browser_job.engine_fallback 中关联触发切换的 Google 调用。
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Capability'}
      - {$ref: '#/components/parameters/BusinessLanguage'}
      - {$ref: '#/components/parameters/CallStatus'}
      - {$ref: '#/components/parameters/Evaluation'}
      - {$ref: '#/components/parameters/Q'}
      - {$ref: '#/components/parameters/Operation'}
      - {$ref: '#/components/parameters/CallOrigin'}
      - {$ref: '#/components/parameters/EndpointId'}
      responses:
        '200':
          description: 查询上游尝试
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items: {$ref: '#/components/schemas/Call'}
                          minItems: 0
                        next_cursor:
                          anyOf:
                          - {type: string, minLength: 1}
                          - {type: 'null'}
                      required: [items, next_cursor]
                      additionalProperties: false
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoint-calls/{id}:
    get:
      operationId: getCall
      summary: 调用详情
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/RecordId'}
      responses:
        '200':
          description: 调用详情
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Call'}
        default: {$ref: '#/components/responses/Failure'}
  /admin/v1/endpoint-statistics:
    get:
      operationId: getStatistics
      summary: 按窗口聚合
      security:
      - AdminSession: []
      parameters:
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Capability'}
      - {$ref: '#/components/parameters/BusinessLanguage'}
      - {$ref: '#/components/parameters/Operation'}
      - {$ref: '#/components/parameters/CallOrigin'}
      - {$ref: '#/components/parameters/EndpointId'}
      - in: query
        name: timezone
        schema: {type: string}
        required: false
      - in: query
        name: granularity
        schema:
          type: string
          enum: [hour, day, week, month]
        required: false
      responses:
        '200':
          description: 按窗口聚合
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/Statistics'}
        default: {$ref: '#/components/responses/Failure'}
  /health/live:
    get:
      operationId: healthLive
      summary: Live
      security: []
      responses:
        '200':
          description: 探针状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Live'}
  /health/ready:
    get:
      operationId: healthReady
      summary: Ready
      security: []
      responses:
        '200':
          description: 探针状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
        '503':
          description: 尚未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ready'}
  /admin/v1/cache/overview:
    get:
      operationId: cacheOverview
      summary: 缓存库存、命中及任务消费概览
      security:
      - AdminSession: []
      parameters:
      - &cachepath001
        in: query
        name: project
        schema:
          type: string
      - &cachepath002
        in: query
        name: origin
        schema:
          type: string
      - &cachepath003
        in: query
        name: operation
        schema:
          type: string
      - &cachepath004
        in: query
        name: since
        schema:
          type: integer
      - &cachepath005
        in: query
        name: until
        schema:
          type: integer
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheOverview'
        default:
          $ref: '#/components/responses/Failure'
  /admin/v1/cache/tasks:
    get:
      operationId: cacheTasks
      summary: 查询缓存后台任务
      security:
      - AdminSession: []
      parameters:
      - *cachepath001
      - *cachepath002
      - *cachepath003
      - *cachepath004
      - *cachepath005
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheTasks'
        default:
          $ref: '#/components/responses/Failure'
  /admin/v1/cache/tasks/{id}:
    get:
      operationId: cacheTask
      summary: 查看缓存任务阶段和版本
      security:
      - AdminSession: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheTask'
        default:
          $ref: '#/components/responses/Failure'
  /admin/v1/settings/cache-concurrency:
    get:
      operationId: getCacheConcurrency
      summary: 后台浏览器并发
      security:
      - AdminSession: []
      parameters: &cachepath006 []
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheConcurrencyView'
        default:
          $ref: '#/components/responses/Failure'
    put:
      operationId: putCacheConcurrency
      summary: 修改后台浏览器并发
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - $ref: '#/components/parameters/SameOriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheConcurrencyWrite'
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheConcurrencyView'
        '409':
          $ref: '#/components/responses/Failure'
        default:
          $ref: '#/components/responses/Failure'
  /admin/v1/settings/cache-policy:
    get:
      operationId: getCachePolicy
      summary: 系统双热点默认策略
      security:
      - AdminSession: []
      parameters: *cachepath006
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CachePolicyView'
        default:
          $ref: '#/components/responses/Failure'
    put:
      operationId: putCachePolicy
      summary: 修改系统双热点默认策略
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - $ref: '#/components/parameters/SameOriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CachePolicyWrite'
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CachePolicyView'
        '409':
          $ref: '#/components/responses/Failure'
        default:
          $ref: '#/components/responses/Failure'
  /admin/v1/settings/cache-model-budgets:
    get:
      operationId: getCacheModelBudget
      summary: 后台模型预算
      security:
      - AdminSession: []
      parameters: *cachepath006
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheModelBudgetView'
        default:
          $ref: '#/components/responses/Failure'
    put:
      operationId: putCacheModelBudget
      summary: 修改后台模型预算
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - $ref: '#/components/parameters/SameOriginHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheModelBudgetWrite'
      responses:
        '200':
          description: 缓存管理结果。
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdminEnvelope'
                - properties:
                    data:
                      $ref: '#/components/schemas/CacheModelBudgetView'
        '409':
          $ref: '#/components/responses/Failure'
        default:
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    AdminSession: {type: apiKey, in: cookie, name: oas_admin_session}
    Csrf: {type: apiKey, in: header, name: X-CSRF-Token}
  responses:
    HistoryRetention:
      description: 全局唯一的保留设置，应用于随后新建的请求、所属材料及统计贡献，既有记录按创建时固定的到期时间处理。
      content:
        application/json:
          schema:
            allOf:
            - {$ref: '#/components/schemas/AdminEnvelope'}
            - properties: {data: {$ref: '#/components/schemas/RetentionView'}}
    Failure:
      description: 分类错误及本地化文案。
      content:
        application/json:
          schema: {$ref: ./business.openapi.yaml#/components/schemas/Failure}
  schemas:
    RetentionView:
      type: object
      required: [retention_days, version]
      properties: {retention_days: {type: integer, minimum: 1, maximum: 36500, default: 7}, version: {type: integer, minimum: 1}}
      additionalProperties: false
    RetentionWrite:
      type: object
      required: [retention_days, expected_version]
      properties: {retention_days: {type: integer, minimum: 1, maximum: 36500}, expected_version: {type: integer, minimum: 1}}
      additionalProperties: false
    Login:
      description: 初始管理员在安装时配置，默认 admin / admin123；登录不会重新初始化账号。
      type: object
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 1}
      required: [username, password]
      additionalProperties: false
    Session:
      type: object
      properties:
        supported_languages: {type: array, description: 管理界面的显示语言。, items: {type: string, minLength: 1}}
        username: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
        csrf_token: {type: string, minLength: 1}
      required: [username, expires_at, csrf_token]
      additionalProperties: false
    Version:
      type: object
      properties:
        expected_version: {type: integer, minimum: 1}
      required: [expected_version]
      additionalProperties: false
    KeyUpdate:
      type: object
      properties:
        api_key: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
      required: [api_key, version]
      additionalProperties: false
    Deleted:
      type: object
      properties:
        id: {type: string, format: uuid}
      required: [id]
      additionalProperties: false
    TestResult:
      type: object
      properties:
        diagnostics: {$ref: ./proxy-test.schema.yaml}
        started_at: {type: string, format: date-time, description: 测试发起时间，同版本的迟到回执按它判断先后。}
        resource_version: {type: integer, minimum: 1}
        trace_request_id: {type: string, minLength: 1, description: 关联的管理测试记录 ID。}
        search_attempts:
          type: array
          description: 内置搜索测试中已发送的引擎尝试，按派发顺序列出。
          items:
            type: object
            additionalProperties: false
            required: [engine, status, reason, call_id]
            properties:
              engine: {enum: [google, baidu]}
              status: {enum: [success, empty, partial, error, cancelled]}
              reason: {type: [string, 'null']}
              call_id: {type: string, format: uuid}
        status:
          type: string
          enum: [success, error]
        tested_at: {type: string, format: date-time}
        elapsed_ms: {type: integer, minimum: 0}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
      required: [resource_version, status, tested_at, elapsed_ms, reason]
      additionalProperties: false
    ProxyCreate:
      type: object
      properties:
        name: {type: string, minLength: 1}
        scheme:
          type: string
          enum: [socks5, https]
        host: {type: string, minLength: 1}
        port: {type: integer, minimum: 1, maximum: 65535}
        auth_mode:
          type: string
          enum: [none, password]
        max_concurrency: {type: integer, minimum: 1}
        enabled: {type: boolean}
        secret:
          type: object
          properties:
            username: {type: string, minLength: 1}
            password: {type: string, minLength: 1}
          required: [username, password]
          additionalProperties: false
      required: [name, scheme, host, port, auth_mode, max_concurrency, enabled]
      additionalProperties: false
      if:
        properties:
          auth_mode: {const: password}
      then:
        required: [secret]
      else:
        not:
          required: [secret]
    ProxyUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1}
        scheme:
          type: string
          enum: [socks5, https]
        host: {type: string, minLength: 1}
        port: {type: integer, minimum: 1, maximum: 65535}
        auth_mode:
          type: string
          enum: [none, password]
        max_concurrency: {type: integer, minimum: 1}
        enabled: {type: boolean}
        expected_version: {type: integer, minimum: 1}
        secret_action:
          type: string
          enum: [keep, replace, clear]
        secret:
          type: object
          properties:
            username: {type: string, minLength: 1}
            password: {type: string, minLength: 1}
          required: [username, password]
          additionalProperties: false
      required: [name, scheme, host, port, auth_mode, max_concurrency, enabled, expected_version, secret_action]
      additionalProperties: false
      allOf:
      - if:
          properties:
            secret_action: {const: replace}
        then:
          required: [secret]
        else:
          not:
            required: [secret]
      - if:
          properties:
            auth_mode: {const: password}
        then:
          properties:
            secret_action:
              type: string
              enum: [keep, replace]
        else:
          properties:
            secret_action:
              type: string
              enum: [keep, clear]
    ProxyView:
      type: object
      properties:
        google_probe: {$ref: ./google-reachability.schema.yaml}
        name: {type: string, minLength: 1}
        scheme:
          type: string
          enum: [socks5, https]
        host: {type: string, minLength: 1}
        port: {type: integer, minimum: 1, maximum: 65535}
        auth_mode:
          type: string
          enum: [none, password]
        max_concurrency: {type: integer, minimum: 1}
        enabled: {type: boolean}
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        has_secret: {type: boolean}
        health:
          type: string
          enum: [unknown, healthy, degraded, cooling, probing, disabled]
        failure_count: {type: integer, minimum: 0}
        health_backoff: {type: integer, minimum: 0}
        health_revision: {type: integer, minimum: 0}
        cooldown_until: {type: [string, 'null'], format: date-time}
        last_health_check: {type: [string, 'null'], format: date-time}
        health_reason: {type: [string, 'null']}
        active_leases: {type: integer, minimum: 0}
        last_test:
          anyOf:
          - {$ref: '#/components/schemas/TestResult'}
          - {type: 'null'}
      required: [name, scheme, host, port, auth_mode, max_concurrency, enabled, id, version, has_secret, health,
        active_leases, last_test, google_probe]
      additionalProperties: false
    PoolCreate:
      type: object
      properties:
        name: {type: string, minLength: 1}
        members:
          type: array
          items:
            type: object
            properties:
              proxy_id: {type: string, format: uuid}
              weight: {type: integer, minimum: 1, maximum: 100}
            required: [proxy_id, weight]
            additionalProperties: false
          minItems: 0
          maxItems: 100
      required: [name, members]
      additionalProperties: false
    PoolUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1}
        members:
          type: array
          items:
            type: object
            properties:
              proxy_id: {type: string, format: uuid}
              weight: {type: integer, minimum: 1, maximum: 100}
            required: [proxy_id, weight]
            additionalProperties: false
          minItems: 0
          maxItems: 100
        expected_version: {type: integer, minimum: 1}
      required: [name, members, expected_version]
      additionalProperties: false
    PoolView:
      type: object
      properties:
        name: {type: string, minLength: 1}
        members:
          type: array
          items:
            type: object
            properties:
              proxy_id: {type: string, format: uuid}
              weight: {type: integer, minimum: 1, maximum: 100}
            required: [proxy_id, weight]
            additionalProperties: false
          minItems: 0
          maxItems: 100
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
      required: [name, members, id, version]
      additionalProperties: false
    EndpointProvider:
      type: string
      enum: [browser, tavily, searxng, anysearch, deepseek, crawl4ai, openai_compatible]
    EndpointAdapterRules:
      type: object
      allOf:
      - {$ref: ./endpoint-provider.schema.yaml}
      - if: {properties: {kind: {const: search}}}
        then: {properties: {adapter: {enum: [http_search, integrated_search, browser_search]}}}
      - if: {properties: {kind: {const: reader}}}
        then: {properties: {adapter: {enum: [http_reader, browser_reader]}}}
      - if: {properties: {kind: {const: model}}}
        then: {properties: {adapter: {const: chat_model}}}
      - if: {properties: {adapter: {enum: [browser_search, browser_reader]}}}
        then:
          properties: {base_url: {type: 'null'}, secret_action: {const: keep}, has_secret: {const: false}}
          not: {required: [secret]}
        else:
          required: [base_url]
          properties: {base_url: {type: string, format: uri, pattern: '^https?://'}}
      - if: {properties: {adapter: {const: chat_model}}}
        then:
          properties:
            options:
              type: object
              properties:
                model: {type: string, minLength: 1}
                tokenizer: {type: string, minLength: 1}
                max_input_tokens: {type: integer, minimum: 1}
                max_output_tokens: {type: integer, minimum: 1}
                reasoning_effort: {type: string, enum: [none, minimal, low, medium, high, xhigh, max], description: Optional provider-supported reasoning effort. Omit to use the provider default.}
