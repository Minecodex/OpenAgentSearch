      - {$ref: '#/components/parameters/ConfigId'}
      responses:
        '200':
          description: 读取VPN 代理
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/AdminEnvelope'}
                - properties:
                    data: {$ref: '#/components/schemas/ProxyView'}
        default: {$ref: '#/components/responses/Failure'}
    put:
      operationId: updateProxy
      summary: 更新VPN 代理
      security:
      - AdminSession: []
        Csrf: []
      parameters:
      - {$ref: '#/components/parameters/ConfigId'}
