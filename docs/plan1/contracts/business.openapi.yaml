openapi: 3.1.0
info: {title: OpenAgentSearch 业务 API, version: 1.0.0-draft, description: 三个同步操作。整数词法、项目限额、网页实际访问目标和引用完整性由服务端校验。}
security:
- ProjectKey: []
paths:
  /v1/search/list:
    post:
      operationId: searchList
      summary: 搜索列表
      parameters:
      - in: header
        name: Accept-Language
        schema: {type: string, default: zh-CN}
        description: 中英文错误及警告文案。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListInput'}
      responses:
        '200':
          description: 搜索列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400':
          description: 参数或项目能力不满足
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '401':
          description: 项目身份无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '413':
          description: 输入字节超限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '429':
          description: 速率或容量受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
          headers:
            Retry-After:
              description: 有建议等待时间时返回秒数。
              schema: {type: integer, minimum: 1}
        '500':
          description: 内部错误
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '502':
          description: 上游或输出协议失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '503':
          description: 依赖或代理不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '504':
          description: 超过总截止时间
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
  /v1/search/content:
    post:
      operationId: readContent
      summary: 单 URL 的 Markdown 和纯文本正文
      parameters:
      - in: header
        name: Accept-Language
        schema: {type: string, default: zh-CN}
        description: 中英文错误及警告文案。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentInput'}
      responses:
        '200':
          description: 单 URL 的 Markdown 和纯文本正文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentResponse'}
        '400':
          description: 参数或项目能力不满足
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '401':
          description: 项目身份无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '413':
          description: 输入字节超限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '429':
          description: 速率或容量受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
          headers:
            Retry-After:
              description: 有建议等待时间时返回秒数。
              schema: {type: integer, minimum: 1}
        '500':
          description: 内部错误
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '502':
          description: 上游或输出协议失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '503':
          description: 依赖或代理不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '504':
          description: 超过总截止时间
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
  /v1/search/summary:
    post:
      operationId: summarizeSearch
      summary: 检索、打分、分段摘要与整体总结
      description: region 与 current_time 独立可选。启用查询改写时，提示词只包含调用方实际提供的上下文。
      parameters:
      - in: header
        name: Accept-Language
        schema: {type: string, default: zh-CN}
        description: 中英文错误及警告文案。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SummaryInput'}
      responses:
        '200':
          description: 检索、打分、分段摘要与整体总结
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SummaryResponse'}
        '400':
          description: 参数或项目能力不满足
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '401':
          description: 项目身份无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '413':
          description: 输入字节超限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '429':
          description: 速率或容量受限
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
          headers:
            Retry-After:
              description: 有建议等待时间时返回秒数。
              schema: {type: integer, minimum: 1}
        '500':
          description: 内部错误
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '502':
          description: 上游或输出协议失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '503':
          description: 依赖或代理不可用
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
        '504':
          description: 超过总截止时间
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Failure'}
components:
  securitySchemes:
    ProjectKey: {type: http, scheme: bearer, description: 项目业务 Key}
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code: {type: string, minLength: 1}
        message: {type: string, minLength: 1}
        details:
          anyOf:
          - {type: object, additionalProperties: true}
          - {type: 'null'}
    Failure:
      type: object
      additionalProperties: false
      required: [request_id, status, data, warnings, error]
      properties:
        request_id: {type: string, minLength: 1}
        status: {const: error}
        data: {type: 'null'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Message'}
          minItems: 0
        error: {$ref: '#/components/schemas/Message'}
    ListInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2048, pattern: \S}
        language: {type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$', description: 省略时取项目默认语言。}
        time_range:
          type: string
          enum: [day, month, year]
        count: {type: integer, minimum: 1, maximum: 10}
    ContentInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: {type: string, format: uri, pattern: '^https?://'}
        max_chars: {type: integer, minimum: 1}
    SummaryInput:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2048, pattern: \S}
        language: {type: string, pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$', description: 省略时取项目默认语言。}
        time_range:
          type: string
          enum: [day, month, year]
        source_count: {type: integer, minimum: 1, maximum: 10}
        max_chars: {type: integer, minimum: 1}
        region:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          not: {pattern: '[\u0000-\u001F\u007F-\u009F]'}
          description: 调用方提供的自由文本地区。原值按 Unicode 字符计数，注入改写提示词前去除首尾空白。省略即跳过地区片段。
          examples: [上海市浦东新区]
        current_time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,9})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'
          not: {pattern: '^0000-|-00:00$|\s'}
          description: 调用方当地时间，采用 RFC 3339 的互通子集。使用有效公历日期、大写 T、秒和已知偏移（Z 或 ±HH:MM），可带 1–9 位小数秒。保留输入的当地日期和偏移供改写使用。省略即跳过时间片段。
          examples: ['2026-05-01T00:30:00+08:00', '2026-04-30T16:30:00.123Z']
    SearchItem:
      type: object
      additionalProperties: false
      required: [url, title, snippet]
      properties:
        url: {type: string, format: uri, pattern: '^https?://'}
        title: {type: string}
        snippet: {type: string}
    Length:
      type: object
      additionalProperties: false
      required: [original, retained]
      properties:
        original: {type: integer, minimum: 1}
        retained: {type: integer, minimum: 1}
    Segment:
      type: object
      additionalProperties: false
      required: [id, summary]
      properties:
        id: {type: string, minLength: 1}
        summary: {type: string, minLength: 1}
    Source:
      type: object
      additionalProperties: false
      required: [id, url, title, score, kind, segments]
      properties:
        id: {type: string, minLength: 1}
        url: {type: string, format: uri, pattern: '^https?://'}
        title: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        kind:
          type: string
          enum: [body, snippet]
        segments:
          type: array
          items: {$ref: '#/components/schemas/Segment'}
          minItems: 1
          maxItems: 16
    Citation:
      type: object
      additionalProperties: false
      required: [source_id, segment_id]
      properties:
        source_id: {type: string, minLength: 1}
        segment_id: {type: string, minLength: 1}
    ListResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, data, warnings, error]
      properties:
        request_id: {type: string, minLength: 1}
        status:
          type: string
          enum: [success, partial, empty]
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/SearchItem'}
              minItems: 0
              maxItems: 10
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Message'}
          minItems: 0
        error: {type: 'null'}
      if:
        properties:
          status: {const: empty}
      then:
        properties:
          data:
            properties:
              items: {maxItems: 0}
      else:
        properties:
          data:
            properties:
              items: {minItems: 1}
    ContentResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, data, warnings, error]
      properties:
        request_id: {type: string, minLength: 1}
        status: {const: success}
        data:
          type: object
          additionalProperties: false
          required: [url, title, markdown, text, truncated, lengths]
          properties:
            url: {type: string, format: uri, pattern: '^https?://', description: 调用方提交的原始网页地址。}
            final_url: {type: string, format: uri, pattern: '^https?://', description: 正文服务或 Firefox 已确认的最终网页地址。无法确认时省略。}
            title: {type: string}
            markdown: {type: string, minLength: 1}
            text: {type: string, minLength: 1}
            truncated: {type: boolean}
            lengths:
              type: object
              additionalProperties: false
              required: [markdown, text]
              properties:
                markdown: {$ref: '#/components/schemas/Length'}
                text: {$ref: '#/components/schemas/Length'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Message'}
          minItems: 0
        error: {type: 'null'}
    SummaryResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, data, warnings, error]
      properties:
        request_id: {type: string, minLength: 1}
        status:
          type: string
          enum: [success, partial, empty]
        data:
          type: object
          additionalProperties: false
          required: [summary, sources, citations]
          properties:
            summary: {type: string}
            sources:
              type: array
              items: {$ref: '#/components/schemas/Source'}
              minItems: 0
              maxItems: 10
            citations:
              type: array
              items: {$ref: '#/components/schemas/Citation'}
              minItems: 0
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Message'}
          minItems: 0
        error: {type: 'null'}
      if:
        properties:
          status: {const: empty}
      then:
        properties:
          data:
            properties:
              summary: {const: ''}
              sources: {maxItems: 0}
              citations: {maxItems: 0}
      else:
        properties:
          data:
            properties:
              summary: {minLength: 1}
              sources: {minItems: 1}
              citations: {minItems: 1}
