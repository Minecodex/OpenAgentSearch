name: Build oasctl

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: darwin-amd64, runner: macos-15-intel }
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: windows-amd64, runner: windows-2025 }
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build the CLI
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo test --locked -p oasctl
          cargo build --locked --release -p oasctl
      - name: Check version and package the native executable
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          binary=oasctl
          if [[ "$RUNNER_OS" == Windows ]]; then binary=oasctl.exe; fi
          version=$(target/release/"$binary" --version)
          tag="v${version#oasctl }"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "The CLI reports $tag but the Git tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          target/release/"$binary" install --help
          mkdir release-assets
          archive="release-assets/oasctl-$tag-$PLATFORM"
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -c "$archive.zip" "target/release/$binary"
          else
            tar -czf "$archive.tar.gz" -C target/release "$binary"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oasctl-${{ matrix.platform }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
