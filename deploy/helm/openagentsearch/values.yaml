timeZone: Asia/Shanghai
images:
  api: {repository: docker.io/kakj/openagentsearch-api, tag: "v0.0.1-beta", pullPolicy: IfNotPresent}
  web: {repository: docker.io/kakj/openagentsearch-web, tag: "v0.0.1-beta", pullPolicy: IfNotPresent}
  browser: {repository: docker.io/kakj/openagentsearch-browser, tag: "v0.0.1-beta", pullPolicy: IfNotPresent}
publicOrigin: http://localhost:8080
credentials:
  existingSecret: ""
  adminUsername: admin
  adminPassword: "admin123"
  masterKey: ""
  workerKey: ""
postgres:
  image: postgres:18.6-alpine
  storage: 10Gi
  storageClassName: ""
  password: ""
api:
  extraEnv: []
browser:
  extraEnv: []
  replicas: 1
  slots: 6
  resources:
    requests: {cpu: 500m, memory: 3Gi}
    limits: {memory: 5Gi}
history:
  retentionDays: 7
service:
  type: ClusterIP
  port: 80
searxng:
  enabled: false
  extraEnv: []
  settings:
    use_default_settings: true
    search:
      formats: [html, json]
  image: searxng/searxng:2026.11.20-a7959eeaf
crawl4ai:
  enabled: false
  extraEnv: []
  image: unclecode/crawl4ai:0.9.0
  publicDns:
    enabled: false
    image: registry.k8s.io/coredns/coredns:v1.14.2
    upstream: 1.1.1.1
    tlsServerName: cloudflare-dns.com
    clusterDomain: cluster.local
    clusterServer: ""
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
