apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  selector: {app: "{{ .Release.Name }}-postgres"}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {app: "{{ .Release.Name }}-postgres"}
  template:
    metadata:
      labels: {app: "{{ .Release.Name }}-postgres"}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: oas}
            - {name: POSTGRES_USER, value: oas}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ default (printf "%s-credentials" .Release.Name) .Values.credentials.existingSecret }}, key: postgres-password}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, oas, -d, oas]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
