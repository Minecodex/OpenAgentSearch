{{- range $component := list "api" "web" "browser" }}
{{- $image := index $.Values.images $component }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}}
spec:
  {{- if eq $component "web" }}
  type: {{ $.Values.service.type }}
  {{- end }}
  selector: {app: "{{ $.Release.Name }}-{{ $component }}"}
  ports:
    - port: {{ if eq $component "web" }}{{ $.Values.service.port }}{{ else if eq $component "api" }}8080{{ else }}8090{{ end }}
      targetPort: {{ if eq $component "web" }}80{{ else if eq $component "api" }}8080{{ else }}8090{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}}
spec:
  replicas: {{ if eq $component "browser" }}{{ $.Values.browser.replicas }}{{ else }}1{{ end }}
  {{- if eq $component "api" }}
  strategy: {type: Recreate}
  {{- end }}
  selector: {matchLabels: {app: "{{ $.Release.Name }}-{{ $component }}"}}
  template:
    metadata:
      labels: {app: "{{ $.Release.Name }}-{{ $component }}", app.kubernetes.io/instance: {{ $.Release.Name }}}
    spec:
      enableServiceLinks: false
      {{- if eq $component "api" }}
      serviceAccountName: {{ $.Release.Name }}-api
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: {{ $component }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          env:
            {{- if eq $component "web" }}
            - {name: OAS_API_HOST, value: "{{ $.Release.Name }}-api"}
            - {name: OAS_API_PORT, value: "8080"}
            {{- else }}
            - name: OAS_WORKER_KEY
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: worker-key}}
            - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            {{- if eq $component "api" }}
            - {name: TZ, value: {{ $.Values.timeZone | default "Asia/Shanghai" | quote }}}
            - name: OAS_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: admin-username}}
            - name: OAS_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: admin-password}}
            - name: OAS_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: master-key}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: postgres-password}}
            - {name: PGHOST, value: "{{ $.Release.Name }}-postgres"}
            - {name: PGUSER, value: oas}
            - {name: PGDATABASE, value: oas}
            - {name: OAS_PUBLIC_ORIGIN, value: {{ $.Values.publicOrigin | quote }}}
            - {name: OAS_BROWSER_SERVICE, value: "{{ $.Release.Name }}-browser"}
            - {name: OAS_BROWSER_SLOTS, value: {{ $.Values.browser.slots | quote }}}
            - {name: OAS_RETENTION_DAYS, value: {{ $.Values.history.retentionDays | quote }}}
            {{- include "oas.cache.env" $ | nindent 12 }}
            - {name: OAS_SEARXNG_ENABLED, value: {{ $.Values.searxng.enabled | quote }}}
            - {name: OAS_CRAWL4AI_ENABLED, value: {{ $.Values.crawl4ai.enabled | quote }}}
            - {name: OAS_SEARXNG_URL, value: "http://{{ $.Release.Name }}-searxng:8080"}
            - {name: OAS_CRAWL4AI_URL, value: "http://{{ $.Release.Name }}-crawl4ai:11235"}
            {{- if $.Values.crawl4ai.enabled }}
            - name: OAS_CRAWL4AI_KEY
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" $.Release.Name) $.Values.credentials.existingSecret }}, key: crawl4ai-key}}
            {{- end }}
            {{- else }}
            - {name: OAS_WORKER_SLOTS, value: {{ $.Values.browser.slots | quote }}}
            {{- end }}
            {{- end }}
            {{- if eq $component "api" }}
            {{- with $.Values.api.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- else if eq $component "browser" }}
            {{- with $.Values.browser.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if ne $component "web" }}
          livenessProbe:
            httpGet: {path: /health/live, port: {{ if eq $component "api" }}8080{{ else }}8090{{ end }}}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          {{- end }}
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: {{ if eq $component "web" }}/{{ else }}/health/ready{{ end }}
              port: {{ if eq $component "web" }}80{{ else if eq $component "api" }}8080{{ else }}8090{{ end }}
            initialDelaySeconds: 3
            periodSeconds: 3
          {{- if eq $component "browser" }}
          resources: {{ toYaml $.Values.browser.resources | nindent 12 }}
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes: [{name: shm, emptyDir: {medium: Memory, sizeLimit: 512Mi}}]
          {{- end }}
---
{{- end }}
