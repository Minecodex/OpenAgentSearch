apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          args: [migrate]
          env:
            - {name: PGHOST, value: "{{ .Release.Name }}-postgres"}
            - {name: PGUSER, value: oas}
            - {name: PGDATABASE, value: oas}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" .Release.Name) .Values.credentials.existingSecret }}, key: postgres-password}}
            - name: OAS_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" .Release.Name) .Values.credentials.existingSecret }}, key: master-key}}
            - name: OAS_WORKER_KEY
              valueFrom: {secretKeyRef: {name: {{ default (printf "%s-credentials" .Release.Name) .Values.credentials.existingSecret }}, key: worker-key}}
