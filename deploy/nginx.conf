server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # The API owns the 64 KiB limit and localized JSON error contract.
  client_max_body_size 0;
  location /admin/ {
    proxy_request_buffering off;
    proxy_pass http://$OAS_API_HOST:$OAS_API_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 70s;
    proxy_buffering off;
    proxy_ignore_client_abort off;
  }
  location /v1/ {
    proxy_request_buffering off;
    proxy_pass http://$OAS_API_HOST:$OAS_API_PORT;
    proxy_http_version 1.1;
    proxy_read_timeout 70s;
    proxy_buffering off;
    proxy_ignore_client_abort off;
  }
  location /health/ { proxy_pass http://$OAS_API_HOST:$OAS_API_PORT; }
  location / { try_files $uri $uri/ /index.html; }
}
