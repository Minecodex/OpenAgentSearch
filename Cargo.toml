[workspace]
members = ["crates/domain", "crates/runtime", "crates/application", "crates/adapters", "apps/server", "apps/browser-worker", "apps/oasctl"]
resolver = "2"

[workspace.package]
version = "0.0.1-beta"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
oas-domain = { path = "crates/domain" }
oas-runtime = { path = "crates/runtime" }
oas-application = { path = "crates/application" }
oas-adapters = { path = "crates/adapters" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
url = { version = "2", features = ["serde"] }
scraper = "0.24"
pulldown-cmark = "0.13"
ammonia = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "fs", "limit", "set-header"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
strip = true
